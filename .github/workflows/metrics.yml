name: Snapshot download metrics

# GitHub は「今の累計」しか返さないので、定期的に撮って差分を残す。
# 手元の Mac が起動していなくても回るように Actions で撮る。
on:
  schedule:
    - cron: '17 3 * * 1' # 毎週月曜 03:17 UTC（＝12:17 JST）
  workflow_dispatch: # 告知直後など、任意のタイミングで手動実行する用

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: ダウンロード数を追記
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: sh scripts/metrics_snapshot.sh

      - name: 変化があればコミット
        run: |
          if git diff --quiet -- docs/metrics/downloads.csv; then
            echo "変化なし。コミットしない。"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/metrics/downloads.csv
          git commit -m "メトリクス: ダウンロード数のスナップショット ($(date -u +%Y-%m-%d))"
          git push
