  <header class="hero">
    <div>
      <span class="badge" data-en="macOS 13+ · $39 · one-time purchase" data-ja="macOS 13以降 · $39 · 買い切り"></span>

      <p class="lead" data-en="When a log or CSV is too large to understand by scrolling, the next job is not editing. It is finding the shape of the data: what repeats, when it spikes, which columns matter, and where the next clue is. That is what MrkEditor adds." data-ja="ログや CSV がスクロールして分かる量を超えたとき、次に必要なのは編集ではありません。何が繰り返されているか、いつ増えたか、どの列を見るべきか、次の手がかりはどこか。MrkEditor はそこを足します。"></p>

        <div class="fact"><b data-en="Free" data-ja="無料"></b><span data-en="Open, search, filter, compare, edit and save one file." data-ja="1 ファイルを開く、探す、絞る、比較する、編集して保存する。"></span></div>
        <div class="fact"><b data-en="Paid" data-ja="有償"></b><span data-en="Summarize, count, see time, search across files, and ask from measured results." data-ja="要約する、数える、時間で見る、ファイルをまたいで探す、測った結果から聞く。"></span></div>
      </div>
    </aside>

  <section id="features">
    <p class="eyebrow" data-en="What changes" data-ja="何が変わるか"></p>
    <h2 data-en="You stop guessing where to start." data-ja="どこから見るかを、勘で決めなくてよくなる。"></h2>
    <p class="sub" data-en="The screenshots are the product here. Each tool starts from the same idea: measure the file first, then jump back to the exact lines worth reading." data-ja="ここはスクリーンショット込みで見せる場所です。どの道具も考え方は同じです。先にファイルを測り、読む価値のある行へ戻ります。"></p>

    <!-- TODO: replace placeholders with MrkEditor screenshots before final publication.
         Needed: aggregate counts, time histogram, column statistics, cross-file search, AI overview. -->
    <article class="feature-story">
      <div class="copy"><p class="eyebrow" data-en="01 / Counts" data-ja="01 / 集計"></p><h3 data-en="Start with the value that appears too often." data-ja="まず、多すぎる値を見る。"></h3><p data-en="A log line says many things. MrkEditor counts one field at a time, so the repeated user, status, host or error code rises to the top." data-ja="ログの 1 行にはいろいろな値が入っています。MrkEditor はそのうち 1 つの項目を数え、ユーザー、status、host、error code など、目立つ値を上に出します。"></p><p class="plain" data-en="Then click the row to narrow the text to those lines." data-ja="その行をクリックすると、本文はその値を持つ行だけに絞られます。"></p></div>
      <figure class="shot"><div class="placeholder"><span><b data-en="Screenshot: aggregate counts" data-ja="スクリーンショット: 値の集計"></b><span data-en="Table of values on top; filtered log below after selecting one row." data-ja="上に値の一覧。1 行選ぶと、下のログがその値だけに絞られる画面。"></span></span></div></figure>
    </article>

    <article class="feature-story">
      <div class="copy"><p class="eyebrow" data-en="02 / Time" data-ja="02 / 時間"></p><h3 data-en="The spike is the part worth reading." data-ja="読むべき場所は、山になっている。"></h3><p data-en="After filtering to errors, MrkEditor draws the timeline. A quiet file and a failing file look different before you read a single line." data-ja="エラーだけに絞ったあと、MrkEditor が時間の山を描きます。静かなファイルと壊れ始めたファイルは、1 行読む前から見た目が違います。"></p><p class="plain" data-en="Drag over a spike, and the editor jumps back to that time window." data-ja="山をドラッグすると、エディタはその時間帯の行へ戻ります。"></p></div>
      <figure class="shot"><div class="placeholder"><span><b data-en="Screenshot: time histogram" data-ja="スクリーンショット: 時間分布"></b><span data-en="Bars across time; dragging a range filters the text to that window." data-ja="時間ごとの棒グラフ。範囲をドラッグすると本文がその時間帯だけになる画面。"></span></span></div></figure>
    </article>

    <article class="feature-story">
      <div class="copy"><p class="eyebrow" data-en="03 / CSV" data-ja="03 / CSV"></p><h3 data-en="Find the strange column before opening a spreadsheet." data-ja="表計算に移す前に、怪しい列を見つける。"></h3><p data-en="MrkEditor scans every column and shows blanks, distinct values, min/max, sums and averages. It is a quick map of the CSV before you decide what to inspect." data-ja="MrkEditor は全列を走査し、空欄、ユニーク数、最小最大、合計、平均を出します。どこを見るか決める前の、CSV の地図です。"></p></div>
      <figure class="shot"><div class="placeholder"><span><b data-en="Screenshot: column statistics" data-ja="スクリーンショット: 列の統計"></b><span data-en="One row per column, showing type, blanks, distinct count and numeric summary." data-ja="列ごとに、型・空欄・ユニーク数・数値要約が並ぶ画面。"></span></span></div></figure>
    </article>

    <article class="feature-story">
      <div class="copy"><p class="eyebrow" data-en="04 / Folders" data-ja="04 / フォルダ"></p><h3 data-en="When one file is not enough, search the folder." data-ja="1 本で足りなければ、フォルダを探す。"></h3><p data-en="Search results are not a dead list. Click a hit and MrEditor opens that file at that line, with the encoding handled per file." data-ja="検索結果はただの一覧ではありません。結果をクリックすると、そのファイルのその行を開きます。文字コードもファイルごとに判定します。"></p></div>
      <figure class="shot"><div class="placeholder"><span><b data-en="Screenshot: cross-file search" data-ja="スクリーンショット: フォルダ横断検索"></b><span data-en="Results list on one side; selected hit opened at the matching line." data-ja="片側に検索結果。選んだ結果が、該当行で開かれている画面。"></span></span></div></figure>
    </article>
  </section>

  <section id="when">
    <p class="eyebrow" data-en="When to reach for it" data-ja="どういう時に使うか"></p>
    <h2 data-en="Find out when, and what, without opening a spreadsheet." data-ja="Excel を開かずに、いつ・何が増えたかを突き止める。"></h2>
    <p class="sub" data-en="Filter the log to ERROR, drag the peak in the time histogram, and count only that window by path. One flow, no export." data-ja="ログを ERROR で絞り、時間分布の山をドラッグで選び、その時間帯だけをパス別に数える。書き出しなしの一続きです。"></p>
    <figure class="shot"><video src="media/mrkeditor/time-range-count.mp4" poster="media/mrkeditor/time-range-count.jpg" autoplay muted loop playsinline preload="metadata" style="display:block;width:100%;height:auto" data-en="Your browser cannot play this video." data-ja="このブラウザは動画を再生できません。"></video></figure>
    <div class="grid3" style="margin-top:34px;max-width:none;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))">
      <article class="card"><h3 data-en="Why did it fail at 3 a.m.?" data-ja="夜中に落ちた原因は？"></h3><p data-en="Filter to the errors, find the spike, count that window by endpoint or status. You get the cause and the time in a minute." data-ja="エラーに絞り、山を見つけ、その時間帯をエンドポイントやステータスで数える。原因と時刻が 1 分で出ます。"></p></article>
      <article class="card"><h3 data-en="What is odd about this CSV?" data-ja="この CSV のどこがおかしい？"></h3><p data-en="Column statistics show blanks, distinct counts and number ranges per column. Double-click a date column to see when the rows are."  data-ja="列ごとに空欄・ユニーク数・数値の範囲が並びます。日時の列をダブルクリックすると、行がいつに偏っているかが出ます。"></p></article>
      <article class="card"><h3 data-en="Where in the folder is it?" data-ja="フォルダのどこにある？"></h3><p data-en="Search across files with a regular expression, then right-click a hit to count the values it matched in that file." data-ja="フォルダ全体を正規表現で探し、結果を右クリックすると、そのファイルで一致した値の件数が出ます。"></p></article>
      <article class="card"><h3 data-en="A quick count, no Excel." data-ja="ちょっとした集計に Excel は要らない。"></h3><p data-en="For a one-off count or a distribution, you stay in the file you already have open." data-ja="一度きりの件数や分布なら、開いているファイルのまま済みます。"></p></article>
    </div>
    <div class="panel warn" style="margin-top:28px;max-width:none"><h3 data-en="When you do not need it" data-ja="使わなくていい時"></h3><p data-en="To read or search a file, the free MrEditor is enough. MrkEditor is for when you need numbers: counts, distributions, column statistics. It does not replace a spreadsheet for editing cells or building charts." data-ja="読む・探すだけなら無料の MrEditor で足ります。MrkEditor は件数・分布・列の統計といった数字が要る時のものです。セルを直したりグラフを作るための表計算の代わりにはなりません。"></p></div>
  </section>

  <section>
    <p class="eyebrow" data-en="AI, after measurement" data-ja="測った後の AI"></p>
    <h2 data-en="Ask from a compact overview, not from a raw 10 GB file." data-ja="10 GB の生ログではなく、測った概要から聞く。"></h2>
    <p class="sub" data-en="MrkEditor first measures the file: time range, gaps, volume spikes, levels and top templates. The overview works without AI. If you have an on-device model or a BYOK provider configured, MrkEditor can send that compact overview and ask where to look next." data-ja="MrkEditor は先にファイルを測ります。時間範囲、空白、量の山、level、上位テンプレート。概要は AI なしで作れます。オンデバイスモデルまたは BYOK の AI を設定していれば、その小さな概要を渡して、次に見る場所を聞けます。"></p>
